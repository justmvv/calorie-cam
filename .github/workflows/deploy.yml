name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      # The model and onnxruntime-web aren't in git; they are downloaded (and cached) here.
      - name: Cache model and ONNX runtime
        uses: actions/cache@v4
        with:
          path: |
            web/models
            web/ort
          key: ml-assets-${{ hashFiles('tools/fetch_assets.sh') }}

      - name: Fetch model and ONNX runtime
        run: tools/fetch_assets.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Test
        run: flutter test

      # Project site lives at https://<user>.github.io/<repo>/.
      # tools/build_web.sh: release build with versioned URLs and a local CanvasKit (otherwise
      # it wouldn't be cached for offline use). BUILD_ID is compiled into the app and published
      # as build_id.txt; a mismatch tells a running app that a new version is out.
      - name: Build web release
        run: |
          tools/build_web.sh \
            --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=BUILD_ID=${{ github.sha }}
          printf '%s' "${{ github.sha }}" > build/web/build_id.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
