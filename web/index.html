<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Food diary: a dish's calories from a photo, recognized right on your device.">
  <meta name="theme-color" content="#3E7F2C">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Calorie Cam">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Calorie Cam</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="food_ai.js"></script>
  <script src="camera.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.hostname !== 'localhost') {
      window.addEventListener('load', async () => {
        // updateViaCache: 'none': sw.js is always checked bypassing the HTTP cache.
        const reg = await navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' });
        // A PWA can stay in memory for days: check for a new SW whenever the app comes back.
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') reg.update().catch(() => {});
        });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
